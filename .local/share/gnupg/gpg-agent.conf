# ~/.local/share/gnupg/gpg-agent.conf
# NOTE: this ALHP build of gnupg reads config from the HOMEDIR, not from
# $XDG_CONFIG_HOME/gnupg. Homedir = ~/.local/share/gnupg (XDG_DATA_HOME).

# --- SSH support -------------------------------------------------------
# (Serves the SSH identities registered in ./sshcontrol via S.gpg-agent.ssh)
enable-ssh-support

# --- Pinentry ------------------------------------------------------------
# Wayland-native, content-adaptive prompt (niri friendly).
pinentry-program /usr/bin/pinentry-fuzzel

# --- Caching (tune to taste) -------------------------------------------
default-cache-ttl 600
max-cache-ttl 7200
default-cache-ttl-ssh 28800
max-cache-ttl-ssh 86400