[Socket]
# Custom GNUPGHOME ⇒ gpgconf computes the hashed socket dir
# ($XDG_RUNTIME_DIR/gnupg/d.<hash-of-homedir>/). Redirect the listen path so
# gpg CLI, gpgconf and SSH_AUTH_SOCK all reach THIS systemd agent.
# (Empty assignment resets the stock ListenStream list.)
ListenStream=
ListenStream=%t/gnupg/d.uom1dksd85dn6iypwh67fwc9/S.gpg-agent